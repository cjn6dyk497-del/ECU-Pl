<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060404">
<title>E46 ECU</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- sete famílias apenas: a unidade carrega isto pelo WiFi do carro -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;500&family=Oswald:wght@300;400;500;600&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&family=Teko:wght@300;400;500&display=swap">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}

:root{
  --bg:#060404; --panel:#0c0806; --border:#1f1109; --track:#140806;
  --text:#ff4a00; --dim:#7a3212; --accent:#ff4a00;
  --face-c:#181008; --face-e:#0a0604; --num:#cf6024;
  --sev-hi:#d8442c; --sev-md:#c8901c; --sev-lo:#3f8ea0;
  --dusk:0;
}

body{
  background:var(--bg); color:var(--text);
  font-family:'Oswald',-apple-system,sans-serif;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}

/* escurecimento nocturno: só compositor, não obriga o GPU a refiltrar */
#dusk{position:fixed;inset:0;z-index:100;pointer-events:none;background:#000;opacity:var(--dusk);transition:opacity .4s}

header{
  flex-shrink:0;height:38px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;gap:8px;border-bottom:1px solid var(--border);
}
.wm{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.hd-right{display:flex;align-items:center;gap:5px}
.seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.seg button{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;background:transparent;border:none;color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button.on{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.ibtn{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--dim);cursor:pointer;white-space:nowrap}
.ibtn.on{color:var(--accent);border-color:var(--accent)}
.link{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:6px 9px;border-radius:4px;white-space:nowrap;color:var(--sev-hi);border:1px solid color-mix(in srgb,var(--sev-hi) 40%,transparent)}
.link .led{width:7px;height:7px;border-radius:50%;background:var(--sev-hi)}
.link.ok{color:#2ecc71;border-color:color-mix(in srgb,#2ecc71 40%,transparent)}
.link.ok .led{background:#2ecc71;box-shadow:0 0 6px #2ecc71}
.link .hz{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.75}

.view{display:none;flex:1;min-height:0}
.view.on{display:flex;flex-direction:column}
.wrap-rel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

.gauges{flex:1;min-height:0;display:grid;gap:6px;padding:6px}
body[data-layout="classico"] .gauges{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1.02fr)}
body[data-layout="classico"] .cell-boost{grid-column:1/3;display:grid;grid-template-columns:1fr minmax(100px,30%) 1fr;align-items:stretch;gap:8px;padding:6px 10px}
body[data-layout="classico"] .strip{display:none}
body[data-layout="linha"] .gauges{grid-template-columns:1fr 1fr 1fr;grid-template-rows:minmax(0,1fr) auto}
/* a célula do boost volta a ser coluna simples: em grelha de três colunas
   caía na coluna estreita e o manómetro encolhia */
body[data-layout="linha"] .cell-boost{grid-column:auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px}
body[data-layout="linha"] .boost-main{flex:1;min-height:0;width:100%;gap:1px}
body[data-layout="linha"] .boost-main .hbar{display:none}  /* o acelerador já vai na faixa */
body[data-layout="linha"] .side-bars{display:none}
/* os manómetros em linha ficam limitados pela largura, por isso sobra altura:
   dá-se à faixa, que a 7" à distância do braço precisa de ser legível */
body[data-layout="linha"] .strip{grid-column:1/4;padding:9px 8px;gap:9px}
body[data-layout="linha"] .sb{gap:5px}
body[data-layout="linha"] .sb-label{font-size:10px}
body[data-layout="linha"] .sb-val{font-size:15px}
body[data-layout="linha"] .sb-track{height:14px;border-radius:7px}
body[data-layout="linha"] .sb-fill{border-radius:7px}

.cell{background:var(--panel);border:1px solid var(--border);border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px;min-height:0;min-width:0}
.cwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.cwrap canvas{display:block}
.glabel{flex-shrink:0;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.side-bars{display:flex;gap:12px;justify-content:center;align-items:stretch;min-width:0;min-height:0}
.boost-main{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:0}

.vbar{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:0}
.vbar-label{flex-shrink:0;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center;line-height:1.15;white-space:nowrap}
.vbar-track{width:26px;flex:1;min-height:24px;background:var(--track);border:1px solid var(--border);border-radius:7px;overflow:hidden;display:flex;align-items:flex-end}
.vbar-fill{width:100%;border-radius:7px;height:0%;transition:height .25s ease;position:relative}
.vbar-val{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--text);text-align:center;min-width:34px;font-variant-numeric:tabular-nums}

.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:5px 6px;background:var(--panel);border:1px solid var(--border);border-radius:9px}
.sb{display:flex;flex-direction:column;gap:3px;min-width:0}
.sb-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.sb-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-track{height:9px;background:var(--track);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.sb-fill{height:100%;border-radius:5px;width:0%;transition:width .2s ease;position:relative}

.hbar{flex-shrink:0;display:flex;align-items:center;gap:5px;width:100%}
.hbar-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.hbar-track{flex:1;min-width:0;height:10px;background:var(--track);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.hbar-fill{height:100%;border-radius:5px;width:0%;transition:width .2s ease;position:relative}
.hbar-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--text);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* desenhos das barras — --bar-c vem definido por elemento */
.vbar-fill,.hbar-fill,.sb-fill{background:var(--bar-c,var(--accent))}
body[data-bars="grad"] .vbar-fill{background:linear-gradient(0deg,color-mix(in srgb,var(--bar-c) 28%,transparent),var(--bar-c))}
body[data-bars="grad"] .hbar-fill,body[data-bars="grad"] .sb-fill{background:linear-gradient(90deg,color-mix(in srgb,var(--bar-c) 28%,transparent),var(--bar-c))}
body[data-bars="seg"] .vbar-fill{-webkit-mask-image:repeating-linear-gradient(to top,#000 0 5px,transparent 5px 8px);mask-image:repeating-linear-gradient(to top,#000 0 5px,transparent 5px 8px)}
body[data-bars="seg"] .hbar-fill,body[data-bars="seg"] .sb-fill{-webkit-mask-image:repeating-linear-gradient(to right,#000 0 4px,transparent 4px 7px);mask-image:repeating-linear-gradient(to right,#000 0 4px,transparent 4px 7px)}
body[data-bars="blk"] .vbar-fill{-webkit-mask-image:repeating-linear-gradient(to top,#000 0 10px,transparent 10px 14px);mask-image:repeating-linear-gradient(to top,#000 0 10px,transparent 10px 14px)}
body[data-bars="blk"] .hbar-fill,body[data-bars="blk"] .sb-fill{-webkit-mask-image:repeating-linear-gradient(to right,#000 0 8px,transparent 8px 12px);mask-image:repeating-linear-gradient(to right,#000 0 8px,transparent 8px 12px)}
body[data-bars="neon"] .vbar-fill,body[data-bars="neon"] .hbar-fill,body[data-bars="neon"] .sb-fill{background:var(--bar-c);box-shadow:0 0 8px var(--bar-c)}
body[data-bars="out"] .vbar-fill,body[data-bars="out"] .hbar-fill,body[data-bars="out"] .sb-fill{background:color-mix(in srgb,var(--bar-c) 15%,transparent);border:1px solid var(--bar-c)}
body[data-bars="duo"] .vbar-fill{background:linear-gradient(0deg,color-mix(in srgb,var(--bar-c) 32%,transparent) 0 55%,var(--bar-c) 55%)}
body[data-bars="duo"] .hbar-fill,body[data-bars="duo"] .sb-fill{background:linear-gradient(90deg,color-mix(in srgb,var(--bar-c) 32%,transparent) 0 55%,var(--bar-c) 55%)}
body[data-bars="stripe"] .vbar-fill,body[data-bars="stripe"] .hbar-fill,body[data-bars="stripe"] .sb-fill{background:repeating-linear-gradient(45deg,var(--bar-c) 0 4px,color-mix(in srgb,var(--bar-c) 38%,transparent) 4px 8px)}
body[data-bars="dot"] .vbar-fill,body[data-bars="dot"] .hbar-fill,body[data-bars="dot"] .sb-fill{background:color-mix(in srgb,var(--bar-c) 17%,transparent)}
body[data-bars="dot"] .vbar-fill::after{content:'';position:absolute;left:0;right:0;top:0;height:5px;border-radius:3px;background:var(--bar-c)}
body[data-bars="dot"] .hbar-fill::after,body[data-bars="dot"] .sb-fill::after{content:'';position:absolute;top:0;bottom:0;right:0;width:5px;border-radius:3px;background:var(--bar-c)}
body[data-bars="rib"] .vbar-fill{background:linear-gradient(90deg,transparent 0 28%,var(--bar-c) 28% 72%,transparent 72%)}
body[data-bars="rib"] .hbar-fill,body[data-bars="rib"] .sb-fill{background:linear-gradient(0deg,transparent 0 28%,var(--bar-c) 28% 72%,transparent 72%)}

#offline{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--bg) 86%,transparent)}
#offline.on{display:flex}
#offline .big{font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:var(--sev-hi)}
#offline .sub{font-size:11px;color:var(--dim);letter-spacing:.06em;text-align:center;padding:0 20px;line-height:1.5}

#v-err{padding:10px 12px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.err-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.err-hd h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:500}
.ebtn{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:8px 14px;cursor:pointer}
.ebtn:disabled{opacity:.5}
#dtcnote{font-size:10px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.dtc-rows{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.dtc-row{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:var(--panel);border:1px solid var(--border);border-left-width:3px;border-radius:0 6px 6px 0;padding:10px 11px;cursor:pointer;font-family:'Oswald',sans-serif;color:var(--dim)}
.dtc-row.on{border-color:var(--accent);color:var(--text)}
.dtc-row.sev-hi{border-left-color:var(--sev-hi)}
.dtc-row.sev-md{border-left-color:var(--sev-md)}
.dtc-row.sev-lo{border-left-color:var(--sev-lo)}
.dtc-row .code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;color:var(--text);flex-shrink:0}
.dtc-row .ttl{font-size:12px;flex:1;min-width:0}
.sev{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:3px;font-weight:500;white-space:nowrap}
.sev-hi{color:var(--sev-hi);border:1px solid color-mix(in srgb,var(--sev-hi) 45%,transparent)}
.sev-md{color:var(--sev-md);border:1px solid color-mix(in srgb,var(--sev-md) 45%,transparent)}
.sev-lo{color:var(--sev-lo);border:1px solid color-mix(in srgb,var(--sev-lo) 45%,transparent)}
.diag{display:grid;grid-template-columns:minmax(130px,180px) 1fr;gap:16px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px}
@media (max-width:700px){.diag{grid-template-columns:1fr}}
.diag-art{display:flex;flex-direction:column;align-items:center;gap:6px}
.diag-art svg{width:100%;max-width:170px;height:auto}
.art-cap{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}
.diag-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.diag-code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--text)}
.diag-title{font-size:13px;color:var(--text);margin-bottom:8px;line-height:1.3}
.diag-mean{font-size:12px;line-height:1.55;color:var(--dim);margin-bottom:10px}
.diag-txt h4{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:500;margin:10px 0 5px}
.diag-txt ul,.diag-txt ol{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.diag-txt li{font-size:11.5px;line-height:1.5;color:var(--dim)}
.diag-txt li b{color:var(--text);font-weight:500}
.cyls{display:flex;gap:5px;margin:10px 0 2px}
.cyl{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px;border:1px solid var(--border);border-radius:5px;background:var(--track)}
.cyl.bad{border-color:var(--sev-hi);background:color-mix(in srgb,var(--sev-hi) 14%,transparent)}
.cyl-n{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--dim)}
.cyl.bad .cyl-n,.cyl.bad .cyl-s{color:var(--sev-hi)}
.cyl-s{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.dg-body{fill:var(--track);stroke:var(--dim);stroke-width:2;stroke-linejoin:round}
.dg-inner{fill:var(--face-c);stroke:var(--dim);stroke-width:1.5}
.dg-line{stroke:var(--dim);stroke-width:1.5;fill:none}
.dg-lead{stroke:var(--dim);stroke-width:1;fill:none;stroke-dasharray:2 2}
.dg-txt{fill:var(--dim);font-family:'Oswald',sans-serif;font-size:9px}
.dg-hi .dg-body,.dg-hi .dg-inner{stroke:var(--sev-hi);stroke-width:2.5}
.dg-hi .dg-line{stroke:var(--sev-hi)}
.dg-glow{fill:none;stroke:var(--sev-hi);stroke-width:2;opacity:.35}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform .22s}
.drawer.on{transform:translateX(0)}
.drawer-hd{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--border)}
.drawer-hd h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--text)}
.xbtn{background:transparent;border:none;color:var(--dim);font-size:20px;line-height:1;padding:4px 10px;cursor:pointer}
.drawer-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 13px 13px}
.axis{padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.axis:last-child{border-bottom:none}
.axis h3{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dice{font-size:12px;padding:3px 7px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:flex;align-items:center;gap:4px;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.05em;padding:7px 9px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--dim);cursor:pointer}
.chip.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.sw{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.14)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.cfield{display:flex;flex-direction:column;gap:3px}
.cfield span{font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.cfield input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:26px;padding:0;border:1px solid var(--border);border-radius:4px;background:transparent}
.cfield input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.cfield input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
.crow{display:flex;gap:6px;margin-top:8px}
.crow button,.drawer-ft button{flex:1;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 6px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--dim);cursor:pointer}
.drawer-ft{flex-shrink:0;display:flex;gap:7px;padding:10px 13px;border-top:1px solid var(--border)}
.slider{flex:1;accent-color:var(--accent)}
.srow{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--dim)}
.srow .v{font-family:'JetBrains Mono',monospace;color:var(--text);min-width:40px;text-align:right}
</style>
</head>
<body>

<div id="dusk"></div>

<header>
  <span class="wm">BMW E46 · 320D</span>
  <div class="hd-right">
    <div class="seg" id="tabs">
      <button class="on" data-v="live">Ao Vivo</button>
      <button data-v="err">Erros</button>
    </div>
    <button class="ibtn" id="btn-full">Ecrã</button>
    <button class="ibtn" id="btn-cfg">Ajustes</button>
    <div class="link" id="link"><span class="led"></span><span id="link-t">—</span><span class="hz" id="link-hz"></span></div>
  </div>
</header>

<div class="view on" id="v-live">
  <div class="wrap-rel">
    <div class="gauges">
      <div class="cell">
        <div class="cwrap"><canvas id="c-rpm"></canvas></div>
        <div class="glabel">RPM</div>
      </div>
      <div class="cell">
        <div class="cwrap"><canvas id="c-speed"></canvas></div>
        <div class="glabel">KM/H</div>
      </div>
      <div class="cell cell-boost">
        <div class="side-bars">
          <div class="vbar"><div class="vbar-label">Motor</div><div class="vbar-track"><div class="vbar-fill" id="f-coolant"></div></div><div class="vbar-val" id="v-coolant">--</div></div>
          <div class="vbar"><div class="vbar-label">Admis.</div><div class="vbar-track"><div class="vbar-fill" id="f-intake"></div></div><div class="vbar-val" id="v-intake">--</div></div>
        </div>
        <div class="boost-main">
          <div class="cwrap"><canvas id="c-boost"></canvas></div>
          <div class="glabel">Boost bar</div>
          <div class="hbar"><div class="hbar-label">Acel</div><div class="hbar-track"><div class="hbar-fill" id="f-throttle"></div></div><div class="hbar-val" id="v-throttle">--</div></div>
        </div>
        <div class="side-bars">
          <div class="vbar"><div class="vbar-label">Avanço</div><div class="vbar-track"><div class="vbar-fill" id="f-timing"></div></div><div class="vbar-val" id="v-timing">--</div></div>
          <div class="vbar"><div class="vbar-label">Bat.</div><div class="vbar-track"><div class="vbar-fill" id="f-voltage"></div></div><div class="vbar-val" id="v-voltage">--</div></div>
        </div>
      </div>
      <div class="strip" id="strip"></div>
    </div>
    <div id="offline">
      <div class="big">Sem ligação</div>
      <div class="sub" id="offline-sub">À espera do servidor…</div>
    </div>
  </div>
</div>

<div class="view" id="v-err">
  <div class="err-hd">
    <h2>Códigos de erro</h2>
    <button class="ebtn" id="scanbtn">Pesquisar</button>

function vignette(ctx,cx,cy,r,s){const g=ctx.createRadialGradient(cx,cy,r*.82,cx,cy,r);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+s+')');ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=g;ctx.fill();}
function clipFace(ctx,cx,cy,r){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.clip();}

const FACES = [
  {name:'Radial',draw(ctx,cx,cy,r,P){const g=ctx.createRadialGradient(cx-r*.28,cy-r*.32,r*.05,cx,cy,r*1.05);g.addColorStop(0,P.faceC);g.addColorStop(1,P.faceE);ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=g;ctx.fill();vignette(ctx,cx,cy,r,.5);}},
  {name:'Liso',draw(ctx,cx,cy,r,P){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=P.faceE;ctx.fill();vignette(ctx,cx,cy,r,.3);}},
  {name:'Escovado',draw(ctx,cx,cy,r,P){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=P.faceC;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);ctx.globalAlpha=.32;const n=Math.max(26,Math.round(r/3));for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(cx,cy,r*(i/n),0,TAU);ctx.strokeStyle=i%2?P.faceE:P.faceC;ctx.lineWidth=r/n*1.3;ctx.stroke();}ctx.restore();vignette(ctx,cx,cy,r,.55);}},
  {name:'Carbono',draw(ctx,cx,cy,r,P){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=P.faceE;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);const s=Math.max(4,r*.075);for(let y=-r;y<r;y+=s)for(let x=-r;x<r;x+=s){const o=((Math.round(x/s)+Math.round(y/s))&1)===0;ctx.fillStyle=o?P.faceC:P.faceE;ctx.fillRect(cx+x,cy+y,s*.95,s*.95);ctx.globalAlpha=.2;ctx.fillStyle=o?P.faceE:P.faceC;ctx.fillRect(cx+x,cy+y,s*.95,s*.46);ctx.globalAlpha=1;}ctx.restore();vignette(ctx,cx,cy,r,.55);}},
  {name:'Guilhochê',draw(ctx,cx,cy,r,P){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=P.faceC;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);ctx.strokeStyle=P.faceE;ctx.globalAlpha=.55;ctx.lineWidth=Math.max(.5,r*.007);const n=36,rr=r*.52,off=r*.44;for(let i=0;i<n;i++){const a=(i/n)*TAU;ctx.beginPath();ctx.arc(cx+Math.cos(a)*off,cy+Math.sin(a)*off,rr,0,TAU);ctx.stroke();}ctx.restore();vignette(ctx,cx,cy,r,.55);}},
  {name:'Perfurado',draw(ctx,cx,cy,r,P){const g=ctx.createRadialGradient(cx-r*.25,cy-r*.3,r*.05,cx,cy,r);g.addColorStop(0,P.faceC);g.addColorStop(1,P.faceE);ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r*.96);const s=Math.max(6,r*.11),d=Math.max(1.2,r*.024);ctx.fillStyle=P.faceE;ctx.globalAlpha=.85;for(let y=-r,row=0;y<r;y+=s,row++)for(let x=-r+(row&1?s/2:0);x<r;x+=s){ctx.beginPath();ctx.arc(cx+x,cy+y,d,0,TAU);ctx.fill();}ctx.restore();vignette(ctx,cx,cy,r,.5);}},
  {name:'Bissetor',draw(ctx,cx,cy,r,P){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=P.faceE;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);const g=ctx.createLinearGradient(cx,cy-r,cx,cy+r);g.addColorStop(0,P.faceC);g.addColorStop(.5,P.faceC);g.addColorStop(.501,P.faceE);g.addColorStop(1,P.faceE);ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,r*2,r*2);ctx.restore();vignette(ctx,cx,cy,r,.5);}},
  {name:'Anéis',draw(ctx,cx,cy,r,P){const g=ctx.createRadialGradient(cx,cy,r*.05,cx,cy,r);g.addColorStop(0,P.faceC);g.addColorStop(1,P.faceE);ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);ctx.strokeStyle=P.tickMin;ctx.globalAlpha=.5;ctx.lineWidth=Math.max(.5,r*.006);for(let i=1;i<=7;i++){ctx.beginPath();ctx.arc(cx,cy,r*i/7.5,0,TAU);ctx.stroke();}ctx.restore();vignette(ctx,cx,cy,r,.5);}},
  {name:'Raios',draw(ctx,cx,cy,r,P){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=P.faceE;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);ctx.globalAlpha=.4;for(let i=0;i<64;i++){const a0=(i/64)*TAU,a1=((i+1)/64)*TAU;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();ctx.fillStyle=i&1?P.faceC:P.faceE;ctx.fill();}ctx.restore();vignette(ctx,cx,cy,r,.6);}},
  {name:'Poço',draw(ctx,cx,cy,r,P){const g=ctx.createRadialGradient(cx,cy,r*.02,cx,cy,r);g.addColorStop(0,P.faceE);g.addColorStop(.55,P.faceC);g.addColorStop(1,P.faceE);ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=g;ctx.fill();vignette(ctx,cx,cy,r,.5);}},
  {name:'Xadrez',draw(ctx,cx,cy,r,P){ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=P.faceE;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);const s=Math.max(6,r*.16);for(let y=-r;y<r;y+=s)for(let x=-r;x<r;x+=s){if(((Math.round(x/s)+Math.round(y/s))&1)===0){ctx.fillStyle=P.faceC;ctx.fillRect(cx+x,cy+y,s,s);}}ctx.restore();vignette(ctx,cx,cy,r,.6);}},
  {name:'Malha',draw(ctx,cx,cy,r,P){const g=ctx.createRadialGradient(cx,cy,r*.05,cx,cy,r);g.addColorStop(0,P.faceC);g.addColorStop(1,P.faceE);ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.save();clipFace(ctx,cx,cy,r);ctx.strokeStyle=P.tickMin;ctx.globalAlpha=.4;ctx.lineWidth=Math.max(.5,r*.006);const s=Math.max(6,r*.12);for(let x=-r;x<=r;x+=s){ctx.beginPath();ctx.moveTo(cx+x,cy-r);ctx.lineTo(cx+x,cy+r);ctx.stroke();}for(let y=-r;y<=r;y+=s){ctx.beginPath();ctx.moveTo(cx-r,cy+y);ctx.lineTo(cx+r,cy+y);ctx.stroke();}ctx.restore();vignette(ctx,cx,cy,r,.55);}},
];

const BEZELS = [
  {name:'Cromado',draw(ctx,cx,cy,R,r,P){const g=ctx.createLinearGradient(cx,cy-R,cx,cy+R);g.addColorStop(0,P.bezel);g.addColorStop(.55,P.ring);g.addColorStop(1,P.faceE);ctx.beginPath();ctx.arc(cx,cy,R*.99,0,TAU);ctx.fillStyle=g;ctx.fill();}},
  {name:'Mate',draw(ctx,cx,cy,R,r,P){ctx.beginPath();ctx.arc(cx,cy,R*.99,0,TAU);ctx.fillStyle=P.ring;ctx.fill();}},
  {name:'Fino',draw(ctx,cx,cy,R,r,P){ctx.beginPath();ctx.arc(cx,cy,(R+r)/2,0,TAU);ctx.strokeStyle=P.bezel;ctx.lineWidth=Math.max(1,R-r);ctx.stroke();}},
  {name:'Duplo',draw(ctx,cx,cy,R,r,P){ctx.beginPath();ctx.arc(cx,cy,R*.99,0,TAU);ctx.fillStyle=P.ring;ctx.fill();ctx.beginPath();ctx.arc(cx,cy,(R+r)/2,0,TAU);ctx.strokeStyle=P.bezel;ctx.lineWidth=Math.max(1,(R-r)*.3);ctx.stroke();}},
  {name:'Serrilhado',draw(ctx,cx,cy,R,r,P){ctx.beginPath();ctx.arc(cx,cy,R*.99,0,TAU);ctx.fillStyle=P.ring;ctx.fill();ctx.strokeStyle=P.bezel;ctx.lineWidth=Math.max(.8,R*.008);for(let i=0;i<60;i++){const a=(i/60)*TAU,co=Math.cos(a),si=Math.sin(a);ctx.beginPath();ctx.moveTo(cx+co*R*.98,cy+si*R*.98);ctx.lineTo(cx+co*(r+(R-r)*.25),cy+si*(r+(R-r)*.25));ctx.stroke();}}},
  {name:'Escovado',draw(ctx,cx,cy,R,r,P){ctx.beginPath();ctx.arc(cx,cy,R*.99,0,TAU);ctx.fillStyle=P.bezel;ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*.99,0,TAU);ctx.arc(cx,cy,r,0,TAU,true);ctx.clip();ctx.globalAlpha=.4;ctx.strokeStyle=P.ring;for(let i=0;i<22;i++){ctx.beginPath();ctx.arc(cx,cy,r+(R-r)*(i/22),0,TAU);ctx.lineWidth=(R-r)/22*1.2;ctx.stroke();}ctx.restore();}},
  {name:'Parafusos',draw(ctx,cx,cy,R,r,P){ctx.beginPath();ctx.arc(cx,cy,R*.99,0,TAU);ctx.fillStyle=P.ring;ctx.fill();const mid=(R+r)/2,sr=Math.max(1.2,(R-r)*.26);for(let i=0;i<8;i++){const a=(i/8)*TAU+TAU/16;ctx.beginPath();ctx.arc(cx+Math.cos(a)*mid,cy+Math.sin(a)*mid,sr,0,TAU);ctx.fillStyle=P.bezel;ctx.fill();}}},
  {name:'Grosso',draw(ctx,cx,cy,R,r,P){const g=ctx.createLinearGradient(cx,cy-R,cx,cy+R);g.addColorStop(0,P.bezel);g.addColorStop(1,P.faceE);ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fillStyle=g;ctx.fill();}},
  {name:'Interior',draw(ctx,cx,cy,R,r,P){ctx.beginPath();ctx.arc(cx,cy,r*.995,0,TAU);ctx.strokeStyle=P.bezel;ctx.lineWidth=Math.max(1,R*.018);ctx.stroke();}},
  {name:'Nenhum',draw(){}},
];

const NUMERALS = [

const TICKS = [
  {name:'Barras',draw(g){const c=g.ctx,cx=g.cx,cy=g.cy,r=g.r,R=g.R,P=g.P;c.lineCap='butt';c.strokeStyle=P.tickMin;c.lineWidth=Math.max(.6,R*.007);for(const v of g.minors){const a=g.ang(v),co=Math.cos(a),si=Math.sin(a);c.beginPath();c.moveTo(cx+co*r*.90,cy+si*r*.90);c.lineTo(cx+co*r*.858,cy+si*r*.858);c.stroke();}for(const v of g.majors){const a=g.ang(v),co=Math.cos(a),si=Math.sin(a);c.strokeStyle=g.hot(v)?P.danger:P.tickMaj;c.lineWidth=Math.max(1.2,R*.015);c.beginPath();c.moveTo(cx+co*r*.90,cy+si*r*.90);c.lineTo(cx+co*r*.795,cy+si*r*.795);c.stroke();}}},
  {name:'Cabelo',draw(g){const c=g.ctx,cx=g.cx,cy=g.cy,r=g.r,R=g.R,P=g.P;c.lineCap='butt';c.lineWidth=Math.max(.6,R*.006);for(const v of g.minors){const a=g.ang(v),co=Math.cos(a),si=Math.sin(a);c.strokeStyle=P.tickMin;c.beginPath();c.moveTo(cx+co*r*.90,cy+si*r*.90);c.lineTo(cx+co*r*.87,cy+si*r*.87);c.stroke();}for(const v of g.majors){const a=g.ang(v),co=Math.cos(a),si=Math.sin(a);c.strokeStyle=g.hot(v)?P.danger:P.tickMaj;c.beginPath();c.moveTo(cx+co*r*.90,cy+si*r*.90);c.lineTo(cx+co*r*.82,cy+si*r*.82);c.stroke();}}},
  {name:'Pontos',draw(g){const c=g.ctx,cx=g.cx,cy=g.cy,r=g.r,R=g.R,P=g.P;for(const v of g.minors){const a=g.ang(v);c.beginPath();c.arc(cx+Math.cos(a)*r*.88,cy+Math.sin(a)*r*.88,Math.max(.7,R*.007),0,TAU);c.fillStyle=P.tickMin;c.fill();}for(const v of g.majors){const a=g.ang(v);c.beginPath();c.arc(cx+Math.cos(a)*r*.88,cy+Math.sin(a)*r*.88,Math.max(1.4,R*.016),0,TAU);c.fillStyle=g.hot(v)?P.danger:P.tickMaj;c.fill();}}},
  {name:'Cunhas',draw(g){const c=g.ctx,cx=g.cx,cy=g.cy,r=g.r,R=g.R,P=g.P;c.lineCap='butt';c.strokeStyle=P.tickMin;c.lineWidth=Math.max(.6,R*.006);for(const v of g.minors){const a=g.ang(v),co=Math.cos(a),si=Math.sin(a);c.beginPath();c.moveTo(cx+co*r*.90,cy+si*r*.90);c.lineTo(cx+co*r*.865,cy+si*r*.865);c.stroke();}for(const v of g.majors){const a=g.ang(v),w=R*.020;c.save();c.translate(cx,cy);c.rotate(a);c.beginPath();c.moveTo(r*.90,-w);c.lineTo(r*.90,w);c.lineTo(r*.775,0);c.closePath();c.fillStyle=g.hot(v)?P.danger:P.tickMaj;c.fill();c.restore();}}},

const GAUGES = {
  rpm:  {el:'c-rpm',  min:0, max:6000, unit:'rpm', dec:0, scale:1000,
         ticks:[0,1000,2000,3000,4000,5000,6000], minorPer:4, warn:4200, danger:5000, shift:4600, eps:8},
  speed:{el:'c-speed',min:0, max:260,  unit:'km/h',dec:0, scale:1,
         ticks:[0,40,80,120,160,200,240], minorPer:4, warn:200, danger:240, eps:.4},
  boost:{el:'c-boost',min:-1,max:3,    unit:'bar', dec:2, scale:1,
         ticks:[-1,0,1,2,3], minorPer:5, warn:2, danger:2.5, eps:.008},
};
for(const g of Object.values(GAUGES)){
  g.canvas=document.getElementById(g.el);
  g.bg=document.createElement('canvas');
  g.shown=null;
}
const A0=Math.PI*.75, SPAN=Math.PI*1.5;
let dirty=true;
const markDirty=()=>{dirty=true;for(const g of Object.values(GAUGES))g.shown=null;};

function paintGlass(ctx,cx,cy,r){
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.clip();
  const g=ctx.createLinearGradient(cx-r,cy-r,cx+r*.35,cy+r*.55);
  g.addColorStop(0,'rgba(255,255,255,0.045)');
  g.addColorStop(.42,'rgba(255,255,255,0.012)');
  g.addColorStop(.7,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,r*2,r*2);
  ctx.restore();
}

function buildStatic(cfg){
  const W=cfg.canvas.width, H=cfg.canvas.height;
  if(!W||!H) return;
  cfg.bg.width=W; cfg.bg.height=H;
  const ctx=cfg.bg.getContext('2d');
  const cx=W/2, cy=H/2, R=Math.min(W,H)/2, r=R*.86, p=P();
  const norm=v=>Math.max(0,Math.min(1,(v-cfg.min)/(cfg.max-cfg.min)));
  const ang=v=>A0+norm(v)*SPAN, hot=v=>v>=(cfg.danger!==undefined?cfg.danger:Infinity);

  ctx.clearRect(0,0,W,H);
  BEZELS[S.bezel].draw(ctx,cx,cy,R,r,p);
  FACES[S.face].draw(ctx,cx,cy,r,p);

  ctx.beginPath();ctx.arc(cx,cy,r*.90,A0,A0+SPAN);
  ctx.strokeStyle=p.tickMin;ctx.lineWidth=Math.max(.5,R*.005);ctx.stroke();

  const bandR=r*.955, bandW=Math.max(2,R*.030);
  ctx.lineCap='butt';
  if(cfg.warn!==undefined){ctx.beginPath();ctx.arc(cx,cy,bandR,ang(cfg.warn),ang(cfg.danger));ctx.strokeStyle=p.warn;ctx.lineWidth=bandW;ctx.stroke();}
  if(cfg.danger!==undefined){ctx.beginPath();ctx.arc(cx,cy,bandR,ang(cfg.danger),A0+SPAN);ctx.strokeStyle=p.danger;ctx.lineWidth=bandW;ctx.stroke();}

  const majStep=cfg.ticks[1]-cfg.ticks[0], minStep=majStep/(cfg.minorPer||4);
  const nMin=Math.round((cfg.max-cfg.min)/minStep), minors=[];
  for(let i=0;i<=nMin;i++){const v=cfg.min+i*minStep;
    if(cfg.ticks.some(t=>Math.abs(t-v)<minStep*.05)) continue;
    minors.push(v);}
  TICKS[S.tick].draw({ctx:ctx,cx:cx,cy:cy,r:r,R:R,P:p,cfg:cfg,ang:ang,hot:hot,majors:cfg.ticks,minors:minors});

  const N=NUMERALS[S.num];
  if(!N.hidden){
    ctx.font=N.weight+' '+Math.round(R*N.size)+'px '+N.font;
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const tv of cfg.ticks){const a=ang(tv),lr=r*N.radius;
      ctx.fillStyle=hot(tv)?p.danger:p.num;
      ctx.fillText(String(tv/cfg.scale),cx+Math.cos(a)*lr,cy+Math.sin(a)*lr);}
  }
  if(!FX().glass) paintGlass(ctx,cx,cy,r);
}

function drawGauge(cfg,value){
  const c=cfg.canvas, W=c.width, H=c.height;
  if(!W||!H) return;
  const ctx=c.getContext('2d');
  const cx=W/2, cy=H/2, R=Math.min(W,H)/2, r=R*.86, p=P(), fx=FX();
  const norm=v=>Math.max(0,Math.min(1,(v-cfg.min)/(cfg.max-cfg.min)));
  const ang=v=>A0+norm(v)*SPAN;

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(cfg.bg,0,0);

  if(cfg.shift!==undefined){
    const sa=ang(cfg.shift), sx=cx+Math.cos(sa)*r*.53, sy=cy+Math.sin(sa)*r*.53;
    const sr=R*.036, lit=value>=cfg.shift;
    if(lit&&fx.shadow){ctx.shadowColor=p.danger;ctx.shadowBlur=R*.16;}
    ctx.beginPath();ctx.arc(sx,sy,sr,0,TAU);
    ctx.fillStyle=lit?p.danger:p.faceE;ctx.fill();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(sx,sy,sr,0,TAU);
    ctx.strokeStyle=p.tickMin;ctx.lineWidth=Math.max(.5,R*.005);ctx.stroke();
  }

  ctx.save();
  ctx.translate(cx,cy);ctx.rotate(ang(value));
  if(fx.shadow){ctx.shadowColor=p.needleG;ctx.shadowBlur=R*.07;}
  NEEDLES[S.needle].draw(ctx,R,r,p);
  ctx.shadowBlur=0;ctx.restore();

  const hubR=R*.055;
  if(!cfg._hub||cfg._hubR!==hubR||cfg._hubC!==p.needle){
    const hg=ctx.createRadialGradient(cx-hubR*.35,cy-hubR*.35,0,cx,cy,hubR);
    hg.addColorStop(0,p.needleG);hg.addColorStop(.5,p.needle);hg.addColorStop(1,p.faceE);
    cfg._hub=hg;cfg._hubR=hubR;cfg._hubC=p.needle;
  }
  ctx.beginPath();ctx.arc(cx,cy,hubR,0,TAU);ctx.fillStyle=cfg._hub;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,hubR,0,TAU);
  ctx.strokeStyle=p.faceE;ctx.lineWidth=Math.max(1,R*.008);ctx.stroke();

  ctx.fillStyle=p.num;
  ctx.font='400 '+Math.round(R*.185)+"px 'JetBrains Mono',monospace";
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(value.toFixed(cfg.dec),cx,cy+r*.44);
  ctx.fillStyle=p.tickMin;
  ctx.font='300 '+Math.round(R*.082)+"px 'Oswald',sans-serif";
  ctx.fillText(cfg.unit,cx,cy+r*.61);

  if(fx.glass) paintGlass(ctx,cx,cy,r);
}

function sizeCanvases(){
  const dpr=Math.min(window.devicePixelRatio||1, FX().fps>=60?2:1.5);
  for(const g of Object.values(GAUGES)){
    const w=g.canvas.parentElement;
    const side=Math.floor(Math.min(w.clientWidth,w.clientHeight));
    if(side<40) continue;
    g.canvas.style.width=side+'px'; g.canvas.style.height=side+'px';
    const px=Math.round(side*dpr);
    if(g.canvas.width!==px){g.canvas.width=px;g.canvas.height=px;g._hub=null;markDirty();}
  }
}
if(window.ResizeObserver){
  const ro=new ResizeObserver(sizeCanvases);
  for(const g of Object.values(GAUGES)) ro.observe(g.canvas.parentElement);
}else window.addEventListener('resize',sizeCanvases);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(markDirty);

const BAR_FILL={coolant:'barCoolant',intake:'barIntake',timing:'barTiming',
                voltage:'barVoltage',throttle:'barThrottle'};
const BAR_RANGE={coolant:[40,120,0,'°C'],intake:[0,70,0,'°C'],
                 timing:[0,25,1,'°'],voltage:[11,16,1,'V'],throttle:[0,100,0,'%']};
const STRIP_DEF=[['coolant','Motor'],['intake','Admis.'],['throttle','Acel'],
                 ['timing','Avanço'],['voltage','Bat.']];
const stripEl=document.getElementById('strip');
for(const def of STRIP_DEF){
  const d=document.createElement('div'); d.className='sb';
  d.innerHTML='<div class="sb-top"><span class="sb-label"></span>'+
              '<span class="sb-val" id="s-'+def[0]+'">--</span></div>'+
              '<div class="sb-track"><div class="sb-fill" id="sf-'+def[0]+'"></div></div>';
  d.querySelector('.sb-label').textContent=def[1];
  stripEl.appendChild(d);
}

function setBar(id,val){
  const rg=BAR_RANGE[id], mn=rg[0], mx=rg[1], dec=rg[2], unit=rg[3];
  const pct=val==null?0:Math.max(0,Math.min(100,(val-mn)/(mx-mn)*100));
  const f=document.getElementById('f-'+id), v=document.getElementById('v-'+id);
  if(f) f.style[id==='throttle'?'width':'height']=pct+'%';
  if(v) v.textContent=val==null?'--':val.toFixed(dec);
  const sf=document.getElementById('sf-'+id), sv=document.getElementById('s-'+id);
  if(sf) sf.style.width=pct+'%';
  if(sv) sv.textContent=val==null?'--':val.toFixed(dec)+unit;
}

function applyPalette(){
  const p=P(), st=document.body.style;
  const map=[['--bg',p.bg],['--panel',p.panel],['--border',p.border],['--track',p.track],
             ['--text',p.text],['--dim',p.dim],['--accent',p.accent],['--face-c',p.faceC],
             ['--face-e',p.faceE],['--num',p.num]];
  for(const kv of map) st.setProperty(kv[0],kv[1]);
  for(const id of Object.keys(BAR_FILL)){
    const col=p[BAR_FILL[id]]||p.accent;
    for(const pre of ['f-','sf-']){
      const el=document.getElementById(pre+id);
      if(el) el.style.setProperty('--bar-c',col);
    }
  }
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content',p.bg);
  for(const g of Object.values(GAUGES)) g._hub=null;
}
function applyChrome(){
  document.body.dataset.bars=BARSTYLES[S.bar].id;
  document.body.dataset.layout=LAYOUTS[S.layout].id;
  document.documentElement.style.setProperty('--dusk',((100-S.bright)/100*0.82).toFixed(3));
}
function applyBarScheme(i){
  S.barScheme=i; setChips('barScheme',i);
  const cols=BAR_SCHEMES[i].get(P());
  if(!custom) custom=Object.assign({},PALETTES[S.pal],{name:'Personalizada'});
  BAR_ORDER.forEach((r,k)=>{custom[r]=cols[k];});
  applyPalette(); syncColors(); persist();
}

/* ════════ LIGAÇÃO ════════ */
const linkEl=document.getElementById('link'), linkT=document.getElementById('link-t'),
      linkHz=document.getElementById('link-hz'), offEl=document.getElementById('offline'),
      offSub=document.getElementById('offline-sub');
let live={}, connected=false, backoff=1000;

function setOffline(msg){
  connected=false;
  linkEl.classList.remove('ok'); linkT.textContent='Sem ligação'; linkHz.textContent='';
  offEl.classList.add('on'); offSub.textContent=msg;
  /* valores a zero: mostrar dados velhos como se fossem reais seria perigoso */
  for(const g of Object.values(GAUGES)){
    const z=g.min<0?g.min:0;
    if(g.shown!==z){ drawGauge(g,z); g.shown=z; }
  }
  for(const id of Object.keys(BAR_RANGE)) setBar(id,null);
}

function connect(){
  let ws;
  try{ ws=new WebSocket('ws://'+location.host+'/ws'); }
  catch(_){ setTimeout(connect,backoff); return; }
  ws.onopen=()=>{ backoff=1000; };
  ws.onclose=()=>{ setOffline('A reconectar…'); setTimeout(connect,backoff); backoff=Math.min(backoff*1.6,8000); };
  ws.onerror=()=>{ try{ws.close();}catch(_){} };
  ws.onmessage=e=>{
    let d; try{ d=JSON.parse(e.data); }catch(_){ return; }
    if(d.status!=='ok'){
      setOffline(d.mode?'Servidor ligado, sem dados da centralina ('+d.mode+')':'Sem dados da centralina');
      return;
    }
    live=d; connected=true;
    linkEl.classList.add('ok');
    linkT.textContent=(d.mode||'obd2').toUpperCase();
    linkHz.textContent=d.hz?d.hz.toFixed(1)+'Hz':'';
    offEl.classList.remove('on');
  };
}

let lastFrame=0;
function frame(now){
  requestAnimationFrame(frame);
  const fx=FX();
  if(now-lastFrame < 1000/fx.fps) return;
  lastFrame=now;

  if(dirty){ for(const g of Object.values(GAUGES)) buildStatic(g); dirty=false; }
  if(!connected) return;

  /* só se redesenha o manómetro cujo valor mexeu — ao ralenti poupa quase tudo */
  for(const key of Object.keys(GAUGES)){
    const g=GAUGES[key], v=live[key];
    if(typeof v!=='number') continue;
    if(g.shown===null || Math.abs(v-g.shown)>=g.eps){ drawGauge(g,v); g.shown=v; }
  }
  for(const id of Object.keys(BAR_RANGE)){
    const v=live[id==='intake'?'intake_temp':id];
    setBar(id, typeof v==='number'?v:null);
  }
}

function setChips(axis,idx){

    c.classList.toggle('on',Number(c.dataset.idx)===idx));

function select(axis,idx){
  if(axis==='barScheme'){ applyBarScheme(idx); return; }
  S[axis]=idx; setChips(axis,idx);
  if(axis==='pal'){ custom=null; S.barScheme=0; setChips('barScheme',0); applyPalette(); syncColors(); }
  if(axis==='bar'||axis==='layout') applyChrome();
  if(axis==='layout'||axis==='fx') requestAnimationFrame(sizeCanvases);
  markDirty(); persist();
}

}

function teeth(cx,cy,r1,r2,n,skip){
  let out='';
  for(let i=0;i<n;i++){
    if(skip&&skip.indexOf(i)>=0) continue;
    const a=i/n*TAU;
    out+='<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+
         '" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)+
         '" class="dg-line"/>';
  }
  return out;
}

const SEVL={hi:'Grave',md:'Média',lo:'Ligeira'};

const rowsEl=document.getElementById('dtc-rows'), diagEl=document.getElementById('diag-host'),
      noteEl=document.getElementById('dtcnote');
let openCode=null;

function renderRows(codes){
  rowsEl.replaceChildren();
  for(const code of codes){
    const d=DTC_DB[code]; if(!d) continue;
    const li=document.createElement('li'), b=document.createElement('button');
    b.className='dtc-row sev-'+d.sev+(code===openCode?' on':'');
    b.dataset.code=code;
    b.innerHTML='<span class="code"></span><span class="ttl"></span><span class="sev sev-'+d.sev+'"></span>';
    b.querySelector('.code').textContent=code;
    b.querySelector('.ttl').textContent=d.t;
    b.querySelector('.sev').textContent=SEVL[d.sev];
    li.appendChild(b); rowsEl.appendChild(li);
  }
}
function renderDiag(code){
  diagEl.replaceChildren();
  if(!code) return;
  const d=DTC_DB[code]; if(!d) return;
  const wrap=document.createElement('div'); wrap.className='diag';
  const left=document.createElement('div'); left.className='diag-art';
  left.innerHTML=PARTS[d.part]?PARTS[d.part](d.focus):'';
  const cap=document.createElement('div'); cap.className='art-cap';
  cap.textContent=d.cyl?('Componente — cilindro '+d.cyl):'Componente afectado';
  left.appendChild(cap);

  const right=document.createElement('div'); right.className='diag-txt';
  const top=document.createElement('div'); top.className='diag-top';
  const cd=document.createElement('span'); cd.className='diag-code'; cd.textContent=code;
  const sv=document.createElement('span'); sv.className='sev sev-'+d.sev; sv.textContent=SEVL[d.sev];
  top.append(cd,sv);
  const tt=document.createElement('div'); tt.className='diag-title'; tt.textContent=d.t;
  const mn=document.createElement('p'); mn.className='diag-mean'; mn.textContent=d.mean;
  right.append(top,tt,mn);

  if(d.cyl){
    const strip=document.createElement('div'); strip.className='cyls';
    for(let i=1;i<=4;i++){
      const c=document.createElement('div'); c.className='cyl'+(i===d.cyl?' bad':'');
      const n=document.createElement('div'); n.className='cyl-n'; n.textContent=i;
      const s=document.createElement('div'); s.className='cyl-s'; s.textContent=i===d.cyl?'Falha':'OK';
      c.append(n,s); strip.appendChild(c);
    }
    right.appendChild(strip);
  }
  const sect=(title,items,ord)=>{
    const h=document.createElement('h4'); h.textContent=title;
    const l=document.createElement(ord?'ol':'ul');
    for(const it of items){const li=document.createElement('li');li.innerHTML=it;l.appendChild(li);}
    right.append(h,l);
  };
  sect('Sintomas',d.sym); sect('Causas prováveis',d.cause); sect('Verificações',d.check,true);
  wrap.append(left,right); diagEl.appendChild(wrap);
}
rowsEl.addEventListener('click',e=>{
  const b=e.target.closest('.dtc-row'); if(!b) return;
  const code=b.dataset.code;
  openCode=(openCode===code)?null:code;
  renderRows(Array.prototype.map.call(rowsEl.querySelectorAll('.dtc-row'),x=>x.dataset.code));
  renderDiag(openCode);
});

document.getElementById('scanbtn').addEventListener('click',async e=>{
  const btn=e.currentTarget;
  btn.disabled=true; btn.textContent='A pesquisar…';
  noteEl.textContent='A ler a memória de avarias…';
  try{
    await fetch('/dtc/scan',{method:'POST'});
    await new Promise(r=>setTimeout(r,4000));
    const d=await (await fetch('/dtc')).json();
    if(d.error){ noteEl.textContent='Erro na leitura. Verifique a ligação.'; }
    else if(!d.codes||!d.codes.length){
      noteEl.textContent='Nenhum erro encontrado.'; renderRows([]); renderDiag(null);
    }else{
      const known=d.codes.filter(c=>DTC_DB[c]), unknown=d.codes.filter(c=>!DTC_DB[c]);
      openCode=known[0]||null;
      renderRows(known); renderDiag(openCode);
      noteEl.textContent=d.codes.length+' código(s).'+
        (unknown.length?(' Sem ficha para: '+unknown.join(', ')+'.'):'');
    }
  }catch(_){ noteEl.textContent='Não foi possível contactar o servidor.'; }
  btn.disabled=false; btn.textContent='Pesquisar';
});
document.getElementById('allbtn').addEventListener('click',()=>{
  openCode=null; renderRows(Object.keys(DTC_DB)); renderDiag(null);
  noteEl.textContent='Biblioteca completa — toque num código para ver o componente e o procedimento.';
});

applyPalette(); applyChrome(); syncColors();
keepAwake();
connect();
requestAnimationFrame(()=>{ sizeCanvases(); setOffline('À espera do servidor…'); requestAnimationFrame(frame); });
