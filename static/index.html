<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECU Monitor - BMW E46 320d</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #eee; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

header {
  background: #1a1a1a;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid #333;
}
header h1 { font-size: 1.1rem; color: #ccc; letter-spacing: 2px; text-transform: uppercase; }
#status-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #555; transition: background 0.3s;
}
#status-dot.ok { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
#status-dot.err { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

.tabs {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
}
.tab-btn {
  padding: 8px 20px;
  background: none;
  border: none;
  color: #888;
  cursor: pointer;
  font-size: 0.9rem;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-btn.active { color: #3498db; border-bottom-color: #3498db; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Live tab */
.gauge-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px;
  max-width: 900px;
  margin: 0 auto;
}
.gcell {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.gcell-boost {
  grid-column: 1 / 3;
  width: 44%;
  justify-self: center;
}
.gauge-label {
  font-size: 0.75rem;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
canvas { width: 100%; height: auto; display: block; }

/* Metrics bar */
.metrics-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 0 16px 16px;
  max-width: 900px;
  margin: 0 auto;
  justify-content: center;
}
.metric-card {
  background: #1e1e1e;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 10px 18px;
  text-align: center;
  min-width: 110px;
  flex: 1;
}
.metric-card .m-label {
  font-size: 0.65rem;
  color: #777;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.metric-card .m-val {
  font-size: 1.4rem;
  font-weight: bold;
  color: #eee;
  margin-top: 2px;
}
.metric-card .m-unit {
  font-size: 0.65rem;
  color: #555;
}

/* Error tab */
.error-panel {
  max-width: 600px;
  margin: 30px auto;
  padding: 0 16px;
}
.error-panel h2 { font-size: 1rem; color: #aaa; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
#scan-btn {
  background: #2980b9;
  color: #fff;
  border: none;
  padding: 10px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.95rem;
  margin-bottom: 20px;
  transition: background 0.2s;
}
#scan-btn:hover { background: #3498db; }
#scan-btn:disabled { background: #444; cursor: default; }
#dtc-list { list-style: none; }
#dtc-list li {
  background: #1e1e1e;
  border-left: 3px solid #e74c3c;
  padding: 10px 14px;
  margin-bottom: 8px;
  border-radius: 0 8px 8px 0;
  font-size: 0.9rem;
}
#dtc-list li .code { font-weight: bold; color: #e74c3c; margin-right: 10px; }
#dtc-list li .desc { color: #bbb; }
#dtc-status { color: #666; font-size: 0.85rem; margin-top: 8px; }
#no-dtc { color: #2ecc71; font-size: 0.95rem; display: none; }
</style>
</head>
<body>
<header>
  <h1>BMW E46 &bull; ECU Monitor</h1>
  <div id="status-dot"></div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="setTab('live')">Ao Vivo</button>
  <button class="tab-btn" onclick="setTab('errors')">Erros</button>
</div>

<!-- Live Tab -->
<div id="tab-live" class="tab-panel active">
  <div class="gauge-grid">
    <div class="gcell">
      <div class="gauge-label">RPM</div>
      <canvas id="c-rpm" width="300" height="300"></canvas>
    </div>
    <div class="gcell">
      <div class="gauge-label">Velocidade</div>
      <canvas id="c-speed" width="300" height="300"></canvas>
    </div>
    <div class="gcell gcell-boost">
      <div class="gauge-label">Pressão Turbo</div>
      <canvas id="c-boost" width="300" height="300"></canvas>
    </div>
  </div>

  <div class="metrics-bar">
    <div class="metric-card">
      <div class="m-label">Motor</div>
      <div class="m-val" id="m-coolant">--</div>
      <div class="m-unit">°C</div>
    </div>
    <div class="metric-card">
      <div class="m-label">Admissão</div>
      <div class="m-val" id="m-intake">--</div>
      <div class="m-unit">°C</div>
    </div>
    <div class="metric-card">
      <div class="m-label">Pedal</div>
      <div class="m-val" id="m-throttle">--</div>
      <div class="m-unit">%</div>
    </div>
    <div class="metric-card">
      <div class="m-label">Avanço</div>
      <div class="m-val" id="m-timing">--</div>
      <div class="m-unit">°</div>
    </div>
    <div class="metric-card">
      <div class="m-label">Bateria</div>
      <div class="m-val" id="m-voltage">--</div>
      <div class="m-unit">V</div>
    </div>
  </div>
</div>

<!-- Errors Tab -->
<div id="tab-errors" class="tab-panel">
  <div class="error-panel">
    <h2>Códigos de Erro (DTC)</h2>
    <button id="scan-btn" onclick="reqScan()">Pesquisar Erros</button>
    <div id="no-dtc">Nenhum erro encontrado</div>
    <ul id="dtc-list"></ul>
    <div id="dtc-status"></div>
  </div>
</div>

<script>
// ---- Tab control ----
function setTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'errors') loadDTC();
}

// ---- Gauge drawing ----
function drawGauge(canvas, value, min, max, unit, label, color) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2 + 10;
  const r = Math.min(W, H) * 0.4;
  ctx.clearRect(0, 0, W, H);

  const startA = Math.PI * 0.75;
  const endA = Math.PI * 2.25;
  const range = endA - startA;

  // Track background
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, endA);
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Value arc
  const pct = Math.max(0, Math.min(1, (value - min) / (max - min)));
  const valA = startA + pct * range;
  const gradient = ctx.createLinearGradient(cx - r, cy, cx + r, cy);
  gradient.addColorStop(0, color + 'aa');
  gradient.addColorStop(1, color);
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, valA);
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Tick marks
  for (let i = 0; i <= 10; i++) {
    const a = startA + (i/10) * range;
    const inner = i % 5 === 0 ? r - 28 : r - 18;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*inner, cy + Math.sin(a)*inner);
    ctx.lineTo(cx + Math.cos(a)*(r-8), cy + Math.sin(a)*(r-8));
    ctx.strokeStyle = i % 5 === 0 ? '#555' : '#333';
    ctx.lineWidth = i % 5 === 0 ? 2 : 1;
    ctx.stroke();
  }

  // Needle
  const needleA = startA + pct * range;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(needleA);
  ctx.beginPath();
  ctx.moveTo(-6, 0);
  ctx.lineTo(r - 20, 0);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // Value text
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${W*0.16}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.round(value), cx, cy + r * 0.35);

  // Unit
  ctx.fillStyle = '#888';
  ctx.font = `${W*0.07}px sans-serif`;
  ctx.fillText(unit, cx, cy + r * 0.55);
}

const gauges = {
  rpm:   { canvas: document.getElementById('c-rpm'),   min:0,   max:5000, unit:'rpm',  color:'#3498db', val:0 },
  speed: { canvas: document.getElementById('c-speed'), min:0,   max:260,  unit:'km/h', color:'#2ecc71', val:0 },
  boost: { canvas: document.getElementById('c-boost'), min:-1,  max:2.5,  unit:'bar',  color:'#e67e22', val:0 },
};

function renderGauges() {
  for (const [k, g] of Object.entries(gauges)) {
    drawGauge(g.canvas, g.val, g.min, g.max, g.unit, k, g.color);
  }
}
renderGauges();

// ---- WebSocket ----
const dot = document.getElementById('status-dot');
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => dot.className = 'ok';
  ws.onclose = () => { dot.className = 'err'; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.status !== 'ok') { dot.className = 'err'; return; }
    dot.className = 'ok';
    if (d.rpm   !== undefined) gauges.rpm.val   = d.rpm;
    if (d.speed !== undefined) gauges.speed.val = d.speed;
    if (d.boost !== undefined) gauges.boost.val = d.boost;
    renderGauges();
    set('m-coolant',  d.coolant,      '--');
    set('m-intake',   d.intake_temp,  '--');
    set('m-throttle', d.throttle,     '--');
    set('m-timing',   d.timing,       '--');
    set('m-voltage',  d.voltage,      '--');
  };
}
function set(id, val, fallback) {
  document.getElementById(id).textContent = val !== undefined ? val : fallback;
}
connect();

// ---- DTC ----
async function loadDTC() {
  const r = await fetch('/dtc');
  const d = await r.json();
  const list = document.getElementById('dtc-list');
  const noEl = document.getElementById('no-dtc');
  const status = document.getElementById('dtc-status');
  list.innerHTML = '';
  if (!d.scanned) { status.textContent = 'Ainda não pesquisado.'; noEl.style.display='none'; return; }
  if (d.error) { status.textContent = 'Erro na leitura de DTCs.'; noEl.style.display='none'; return; }
  if (d.codes.length === 0) {
    noEl.style.display = 'block';
    status.textContent = '';
  } else {
    noEl.style.display = 'none';
    d.codes.forEach(code => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="code">${code}</span><span class="desc">${dtcDesc(code)}</span>`;
      list.appendChild(li);
    });
    status.textContent = '';
  }
  if (d.scanned) {
    const ago = Math.round((Date.now()/1000) - d.scanned);
    status.textContent += ` (pesquisado há ${ago}s)`;
  }
}

async function reqScan() {
  const btn = document.getElementById('scan-btn');
  btn.disabled = true; btn.textContent = 'A pesquisar...';
  await fetch('/dtc/scan', {method:'POST'});
  setTimeout(async () => {
    await loadDTC();
    btn.disabled = false; btn.textContent = 'Pesquisar Erros';
  }, 4000);
}

function dtcDesc(code) {
  const descs = {
    'P0100':'Débito de ar em massa (MAF)', 'P0102':'MAF - sinal baixo', 'P0103':'MAF - sinal alto',
    'P0110':'Sensor temp admissão', 'P0115':'Sensor temp motor', 'P0120':'Sensor acelerador (TPS)',
    'P0190':'Sensor pressão combustível', 'P0200':'Circuito injetor', 'P0215':'Relé combustível',
    'P0335':'Sensor rotação (CKP)', 'P0340':'Sensor árvore de cames (CMP)', 'P0380':'Vela de incandescência A',
    'P0381':'Vela de incandescência B', 'P0400':'EGR - caudal', 'P0401':'EGR - caudal insuficiente',
    'P0402':'EGR - caudal excessivo', 'P0405':'Sensor EGR - sinal baixo', 'P0470':'Sensor pressão escape',
    'P0500':'Sensor velocidade', 'P0540':'Sensor temperatura óleo', 'P0560':'Tensão sistema',
    'P0600':'CAN bus', 'P0605':'ROM ECU', 'P0606':'ECU processador',
    'P0700':'Sistema transmissão', 'P1127':'Temperatura turbo', 'P1128':'Temperatura admissão alta',
    'P1351':'Vela incandescência 1', 'P1352':'Vela incandescência 2', 'P1353':'Vela incandescência 3',
    'P1354':'Vela incandescência 4',
  };
  return descs[code] || 'Código de erro desconhecido';
}
</script>
</body>
</html>
